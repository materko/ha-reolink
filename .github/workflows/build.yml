name: Build

on:
  schedule:
    # Daily, at a quiet time. Home Assistant releases land on no fixed hour.
    - cron: "17 4 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  # The patched reolink-aio, pinned to a commit so every build is reproducible.
  # Bump this by hand after rebasing https://github.com/materko/reolink_aio
  REOLINK_AIO: "reolink-aio @ git+https://github.com/materko/reolink_aio@46c12354671b1281071ea8e16c9d249c4a14e018"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Releases are compared against, so their tags have to be present.
          fetch-depth: 0

      - name: Find the latest Home Assistant release
        id: ha
        run: |
          tag=$(curl -fsSL https://api.github.com/repos/home-assistant/core/releases/latest | jq -r .tag_name)
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "Could not determine the latest Home Assistant release" >&2
            exit 1
          fi
          echo "Latest Home Assistant release: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Find the newest build already published for it
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Builds are named after the Home Assistant release they come from. A changed
          # patch or a moved library pin rebuilds against the *same* Home Assistant
          # release, so those carry a revision suffix - without one the release tag
          # would not move and HACS would never see the update.
          base="${{ steps.ha.outputs.tag }}"
          highest=-1
          latest=""
          for tag in $(gh release list --limit 100 --json tagName -q '.[].tagName'); do
            case "$tag" in
              "$base") rev=0 ;;
              "$base".*) rev="${tag##*.}" ;;
              *) continue ;;
            esac
            case "$rev" in
              ''|*[!0-9]*) continue ;;
            esac
            if [ "$rev" -gt "$highest" ]; then
              highest="$rev"
              latest="$tag"
            fi
          done
          echo "Newest published build: ${latest:-none}"
          echo "highest=$highest" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      - name: Fetch the reolink integration from that release
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            -b "${{ steps.ha.outputs.tag }}" \
            https://github.com/home-assistant/core.git /tmp/core
          git -C /tmp/core sparse-checkout set homeassistant/components/reolink
          rm -rf custom_components/reolink
          mkdir -p custom_components
          cp -r /tmp/core/homeassistant/components/reolink custom_components/reolink

      - name: Apply the firmware 2.x patch
        run: |
          # The patch is generated against homeassistant/components/reolink/, so strip
          # that prefix and re-root it under custom_components/.
          git apply -p3 --directory=custom_components --verbose patches/fw2x.patch

      - name: Point the manifest at the patched reolink-aio
        run: |
          jq --arg r "$REOLINK_AIO" '.requirements = [$r]' \
            custom_components/reolink/manifest.json > /tmp/manifest.json
          mv /tmp/manifest.json custom_components/reolink/manifest.json

      - name: Stop unless the result differs from the published build
        id: check
        run: |
          latest="${{ steps.prev.outputs.latest }}"
          if [ -z "$latest" ]; then
            echo "Nothing published yet."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Carry the published version across before comparing, so a rebuild that
          # differs only by the version number is not mistaken for a real change.
          prev=$(git show "$latest:custom_components/reolink/manifest.json" | jq -r '.version // empty')
          if [ -n "$prev" ]; then
            jq --arg v "$prev" '.version = $v' custom_components/reolink/manifest.json > /tmp/manifest.json
            mv /tmp/manifest.json custom_components/reolink/manifest.json
          fi

          if git diff --quiet "$latest" -- custom_components \
             && [ -z "$(git status --porcelain custom_components)" ]; then
            echo "Identical to $latest, nothing to release."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Differs from $latest."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Stamp the version and commit
        id: version
        if: steps.check.outputs.changed == 'true'
        run: |
          base="${{ steps.ha.outputs.tag }}"
          highest="${{ steps.prev.outputs.highest }}"
          if [ "$highest" -lt 0 ]; then
            version="$base"
          else
            version="$base.$((highest + 1))"
          fi
          echo "Publishing as $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          jq --arg v "$version" '.version = $v' \
            custom_components/reolink/manifest.json > /tmp/manifest.json
          mv /tmp/manifest.json custom_components/reolink/manifest.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components
          git commit -m "Build $version for Home Assistant $base"
          git push

      - name: Publish the release HACS installs from
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.version }}" \
            --title "Home Assistant ${{ steps.ha.outputs.tag }}" \
            --notes "Reolink integration from Home Assistant ${{ steps.ha.outputs.tag }}, patched for NVR firmware 2.x."
